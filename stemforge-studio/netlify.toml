[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/jobs/*"
  to = "/.netlify/functions/job-status/:splat"
  status = 200

[[redirects]]
  from = "/api/jobs"
  to = "/.netlify/functions/create-job"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
